name: PadelPoint
options:
  bundleIdPrefix: com.easypadel
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7EFDRY267K
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PadelPoint:
    type: application
    platform: iOS
    sources:
      - path: PadelPoint
      - path: Shared
    info:
      path: PadelPoint/Info.plist
      properties:
        CFBundleDisplayName: EasyPadel
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easypadel.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
      # XcodeGen's own default otherwise injects the legacy, invalid
      # "iPhone Developer" identity here for both configs, which conflicts
      # with Automatic signing (CODE_SIGN_STYLE below) — archives built with
      # it came out completely unsigned ("code object is not signed at
      # all"), which is a real, confirmed bug regardless of anything else.
      # Automatic signing only accepts "Apple Development" as an explicit
      # value here, for both Debug AND Release/Archive — Xcode's own error
      # is explicit about this ("conflicting provisioning settings"
      # otherwise). The actual Apple Distribution re-signing for the App
      # Store happens later, at export time, not during this archive step.
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
    entitlements:
      path: PadelPoint/PadelPoint.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.easypadel.app"
    dependencies:
      - target: PadelPoint Watch App
        embed: true

  PadelPoint Watch App:
    type: application
    platform: watchOS
    sources:
      - path: PadelPoint Watch App
      - path: Shared
    info:
      path: PadelPoint Watch App/Info.plist
      properties:
        CFBundleDisplayName: EasyPadel
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.easypadel.app
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "EasyPadel reads your workout data so it can accurately track your padel matches as workouts."
        NSHealthUpdateUsageDescription: "EasyPadel starts a workout automatically when your match begins and saves it to Health when it ends, so it counts toward your Activity rings."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easypadel.app.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: false
    entitlements:
      path: PadelPoint Watch App/PadelPointWatchApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Same identifier as the iPhone target, so both share one iCloud
        # Key-Value store instead of two separate per-bundle-ID ones — lets
        # a Watch-only reinstall recover history/settings from iCloud too,
        # not just from a live paired iPhone.
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.easypadel.app"

schemes:
  PadelPoint:
    build:
      targets:
        PadelPoint: all
    run:
      config: Debug
      # Lets Full Access purchases be tested in Simulator against the local
      # product definition below, with no App Store Connect setup needed
      # until it's time to actually submit. Remove/replace once the real
      # com.easypadel.app.fullaccess IAP exists in App Store Connect.
      storeKitConfiguration: Configuration.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  PadelPoint Watch App:
    build:
      targets:
        PadelPoint Watch App: all
    run:
      config: Debug
      # The Watch app runs as its own separate process even when launched
      # alongside the iPhone app, with its own independent StoreKit Testing
      # context — without this, the Watch was hitting the real (empty) App
      # Store regardless of what the iPhone's own scheme was configured
      # with, making purchases look unlocked on iPhone but not on Watch.
      storeKitConfiguration: Configuration.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
